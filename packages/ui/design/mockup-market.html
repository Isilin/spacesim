<!-- @dsCard group="Écrans actuels" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Marché de station — état actuel</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #10161f; --border: #1e2836;
    --text: #c8d3e0; --muted: #5f7089;
    --accent: #4fc1ff; --ok: #56d364; --ko: #f85149;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px "Cascadia Code", "JetBrains Mono", Consolas, monospace; padding: 16px; max-width: 560px; }
  .station-panel { border: 1px solid var(--border); background: var(--panel); border-radius: 4px; padding: 14px; }
  h3 { color: #e0b64f; font-size: 15px; margin-bottom: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .badges { display: flex; gap: 6px; margin: 8px 0; }
  .deposit { border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; font-size: 11px; color: var(--accent); }
  .deposit.faction { color: #e0b64f; }
  .deposit.mood { color: var(--ok); }
  .market-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .market-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .market-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .num { text-align: right; }
  .up { color: var(--ok); }
  .down { color: var(--ko); }
  .action-button { background: var(--bg); border: 1px solid var(--accent); color: var(--accent); font: inherit; padding: 3px 8px; font-size: 12px; border-radius: 3px; cursor: pointer; }
  .action-button:hover { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
  <div class="station-panel">
    <h3>Comptoir de Neyra</h3>
    <p class="muted small">Faction Voss-Karyd · système Neyra · prix régionaux</p>
    <div class="badges">
      <span class="deposit faction">réputation +2</span>
      <span class="deposit mood">essor commercial (−8 %)</span>
      <span class="deposit">galaxie 2</span>
    </div>
    <table class="market-table">
      <thead>
        <tr><th>Ressource</th><th class="num">Stock</th><th class="num">Achat</th><th class="num">Vente</th><th></th></tr>
      </thead>
      <tbody>
        <tr><td>Minerai</td><td class="num">4 210</td><td class="num up">8</td><td class="num">11</td><td><button class="action-button">Vendre</button></td></tr>
        <tr><td>Métaux</td><td class="num">1 456</td><td class="num">21</td><td class="num down">26</td><td><button class="action-button">Vendre</button></td></tr>
        <tr><td>Composants</td><td class="num">309</td><td class="num up">64</td><td class="num">80</td><td><button class="action-button">Acheter</button></td></tr>
        <tr><td>Carburant</td><td class="num">2 870</td><td class="num">12</td><td class="num">15</td><td><button class="action-button">Acheter</button></td></tr>
      </tbody>
    </table>
    <p class="muted small">Ravitaillement en orbite requis — la soute part du stock orbital.</p>
  </div>
</body>
</html>
