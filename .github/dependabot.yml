version: 2
updates:
  # Workspace pnpm : une seule entrée à la racine, Dependabot lit pnpm-workspace.yaml et
  # les 7 package.json. Volontairement activé après la vague A du chantier 27 (catalogues
  # pnpm + montées manuelles TS7/Zod4/React19) — pas avant, pour ne pas ouvrir de PR
  # concurrentes sur les mêmes montées majeures déjà en cours à la main.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Le défaut est de cinq. Il a été atteint le 4 août et n'a plus bougé : cinq PR
    # dormantes ont tenu la file pendant un mois, et les montées qu'elles ne
    # contenaient pas — vite, jsdom, biome — sont restées INVISIBLES, jamais
    # proposées. Deux d'entre elles exigeaient justement vite, qu'on ne voyait pas.
    # Un plafond n'est pas neutre : il choisit ce qu'on ne verra pas.
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Les images Docker n'étaient surveillées par rien, et c'est exactement pour ça que le
  # runtime est resté en Node 22 pendant que la 24 passait en maintenance, et Postgres en 17
  # pendant qu'une majeure sortait. Aucune alerte : le fichier ne déclarait que npm et les
  # actions. Dependabot expose deux écosystèmes SÉPARÉS, il faut donc les deux — `docker`
  # ne lit pas les fichiers Compose, et `docker-compose` ne lit pas les Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
