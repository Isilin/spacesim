version: 2
updates:
  # Workspace pnpm : une seule entrée à la racine, Dependabot lit pnpm-workspace.yaml et
  # les 7 package.json. Volontairement activé après la vague A du chantier 27 (catalogues
  # pnpm + montées manuelles TS7/Zod4/React19) — pas avant, pour ne pas ouvrir de PR
  # concurrentes sur les mêmes montées majeures déjà en cours à la main.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Le défaut est de cinq. Il a été atteint le 4 août et n'a plus bougé : cinq PR
    # dormantes ont tenu la file pendant un mois, et les montées qu'elles ne
    # contenaient pas — vite, jsdom, biome — sont restées INVISIBLES, jamais
    # proposées. Deux d'entre elles exigeaient justement vite, qu'on ne voyait pas.
    # Un plafond n'est pas neutre : il choisit ce qu'on ne verra pas.
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
