name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Remplace `pnpm/action-setup` ET `actions/setup-node` (chantier 48) : la version
      # de Node vient de `devEngines` du package.json racine, la même source que l'image
      # Docker. Les deux déclarations indépendantes qui pouvaient diverger en silence
      # n'existent plus. `cache: true` couvre les données du gestionnaire de paquets.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
      # Le cache de tâches est un cache SÉPARÉ : sans lui, `vp run` ne sert à rien en CI,
      # où chaque job part d'un runner neuf. Le remote cache de Vite+ n'est pas livré
      # avant la 1.0 ; c'est le seul mécanisme disponible aujourd'hui.
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ github.sha }}
          restore-keys: vite-task-${{ runner.os }}-
      - run: vp install
      # Trois épinglages de Vite+ doivent bouger ensemble : le CLI, les deux tags
      # d'image, et le fournisseur de couverture. Un décalage ne se voit qu'à
      # l'exécution — ce contrôle le rend immédiat, ici comme au démarrage des
      # conteneurs (docker-entrypoint.sh).
      - run: sh scripts/check-toolchain.sh package.json
      # Format, lint et types en une passe, à la place de `format:check` + `lint` +
      # six `tsc --noEmit`.
      - run: vp check
      # Rien ne construisait en CI : une casse de build atterrissait sur main sans
      # bruit. Le cache de tâches rend les runs suivants gratuits.
      - run: vp run -r build
      - run: vp test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
      # Chromium était retéléchargé à chaque run — rien ne le cachait. La clé suit le
      # lockfile, où la version de @playwright/test est épinglée exactement.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp install
      # Les dépendances système passent par apt et ne se cachent pas ; le binaire, si.
      - run: vp -C apps/web exec playwright install-deps chromium
      - run: vp -C apps/web exec playwright install chromium
      - run: vp run -F @spacesim/web e2e

  # Le serveur n'a pas de build : il tourne depuis ses sources (ADR 0023). Ce qui manquait
  # n'était donc pas une étape de compilation mais la PREUVE que le chemin de production
  # démarre — `NODE_ENV=production` prend `GameEngine.load()`, un autre code que le
  # `loadOrBootstrap()` de tous les autres jobs.
  #
  # L'image `Dockerfile.server` n'est pas construite ici : elle est mince, et c'est le
  # chemin de code qu'on veut garder vert à chaque PR, pas la recette d'empaquetage.
  server-prod-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spacesim
          POSTGRES_USER: spacesim
          POSTGRES_PASSWORD: spacesim
        options: >-
          --health-cmd "pg_isready -U spacesim -d spacesim"
          --health-interval 2s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
      - run: vp install
      - name: Amorcer et servir en conditions de production
        env:
          NODE_ENV: production
          # Base neuve : sans ce drapeau le démarrage DOIT échouer, et c'est l'invariant.
          # Ici on veut l'autre moitié — qu'il sache créer l'univers quand on le demande.
          SPACESIM_BOOTSTRAP: "1"
          DATABASE_URL: postgres://spacesim:spacesim@localhost:5432/spacesim
        run: |
          vp run -F @spacesim/server start &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/health; then
              echo "le serveur répond sur /health"
              exit 0
            fi
            sleep 5
          done
          echo "le serveur n'a pas répondu sur /health" >&2
          exit 1
