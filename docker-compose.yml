# Environnement de dev SpaceSim conteneurisé — aucune install Node sur l'hôte.
#
#   docker compose up app            → Postgres + serveur (3001) + client web (5173) + admin (5174)
#                                      ports hôte surchargeables, voir `ports:` du service `app`
#   docker compose run --rm test     → tests unitaires de la simulation (PGlite mémoire)
#   docker compose run --rm typecheck→ tsc sur les 3 packages
#   docker compose run --rm e2e      → Playwright (pile serveur+web en base mémoire)
#   docker compose run --rm loadtest → harnais de charge REST+WS (Postgres jetable, chantier 27.7)
#
# Le code est monté depuis l'hôte (hot reload) ; les node_modules vivent dans
# des volumes nommés pour ne pas mélanger les binaires natifs Linux avec l'hôte.
# `app` démarre son propre service `postgres` (chantier 20.4, univers persistant
# dans le volume `pgdata`) ; `test`/`typecheck`/`e2e` n'en ont pas besoin (PGlite
# WASM embarqué, pas de service externe).

x-base: &base
  build: .
  working_dir: /app
  volumes:
    - .:/app
    - root_modules:/app/node_modules
    - shared_modules:/app/packages/shared/node_modules
    - protocol_modules:/app/packages/protocol/node_modules
    - server_modules:/app/apps/server/node_modules
    - web_modules:/app/apps/web/node_modules
    - admin_modules:/app/apps/admin/node_modules

services:
  # Postgres de dev (chantier 20.4) : univers persistant d'une session Docker à
  # l'autre, dans le volume nommé `pgdata` — le seul reset volontaire reste
  # `docker compose down -v` (jamais un `rm` de fichier comme avec SQLite).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spacesim
      POSTGRES_USER: spacesim
      POSTGRES_PASSWORD: spacesim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacesim -d spacesim"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Serveur de jeu + client web + client admin (les trois dans le même conteneur : les
  # proxys Vite pointent vers 127.0.0.1:3001, il faut donc un réseau localhost partagé).
  app:
    <<: *base
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             (pnpm --filter @spacesim/server dev &
              pnpm --filter @spacesim/web dev --host 0.0.0.0 &
              pnpm --filter @spacesim/admin dev --host 0.0.0.0)"
    environment:
      DATABASE_URL: postgres://spacesim:spacesim@postgres:5432/spacesim
      # Le serveur bind 127.0.0.1 par défaut (posture prod) ; en conteneur cela rend
      # le port publié 3001 inatteignable depuis la machine hôte.
      HOST: "0.0.0.0"
      # Bind mount hôte Windows → conteneur Linux : les événements fs natifs ne
      # remontent pas de façon fiable (Docker Desktop/WSL2). tsx watch et Vite
      # utilisent chokidar en interne, qui lit ces deux variables pour basculer
      # en polling — sans ça, aucune modification depuis l'hôte ne déclenche
      # de hot reload.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      postgres:
        condition: service_healthy
    # Ports HÔTE surchargeables. D'autres projets de la machine servent sur les mêmes
    # (un Vite prend 5173 par défaut, une API Node 3001) — et le conflit ne se signale
    # PAS forcément par une erreur :
    #
    #   Un Vite lancé nativement bind `127.0.0.1:5173`, plus spécifique que le
    #   `0.0.0.0:5173` de Docker ; Docker garde `[::]:5173`. Les deux serveurs
    #   coexistent alors sans que rien ne proteste, et ce qu'on obtient dépend de la
    #   résolution de `localhost` : IPv4 → l'autre projet, IPv6 → celui-ci. Un
    #   navigateur et un curl peuvent voir deux applications différentes.
    #
    # Diagnostic : `curl -4 http://127.0.0.1:5173/` contre `curl -g http://[::1]:5173/`.
    # Correctif : `SPACESIM_WEB_PORT=5273` dans un `.env` à la racine (déjà ignoré par
    # git), Compose le lit tout seul — penser alors à `.claude/launch.json`, qui code
    # les valeurs par défaut ci-dessous en dur.
    #
    # Les ports INTERNES ne bougent jamais : les proxys Vite pointent sur 127.0.0.1:3001.
    ports:
      - "${SPACESIM_WEB_PORT:-5173}:5173"
      - "${SPACESIM_ADMIN_PORT:-5174}:5174"
      - "${SPACESIM_SERVER_PORT:-3001}:3001"

  # Tests unitaires de la simulation (packages/shared).
  test:
    <<: *base
    command: sh -c "pnpm install --frozen-lockfile && pnpm test"
    profiles: ["tools"]

  # Vérification de types sur les trois packages.
  typecheck:
    <<: *base
    command: sh -c "pnpm install --frozen-lockfile && pnpm typecheck"
    profiles: ["tools"]

  # E2E (chantier 5.3) : Playwright lance sa propre pile serveur+web (voir
  # apps/web/playwright.config.ts) sur SPACESIM_DB=:memory:, isolée de spacesim.db.
  e2e:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.e2e
    volumes:
      - .:/app
      - root_modules:/app/node_modules
      - shared_modules:/app/packages/shared/node_modules
      - protocol_modules:/app/packages/protocol/node_modules
      - server_modules:/app/apps/server/node_modules
      - web_modules:/app/apps/web/node_modules
      - playwright_browsers:/root/.cache/ms-playwright
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             pnpm --filter @spacesim/web exec playwright install chromium &&
             pnpm --filter @spacesim/web e2e"
    profiles: ["tools"]

  # Postgres jetable pour le harnais de charge (chantier 27.7) : jamais le volume
  # `pgdata` de dev — les données de charge ne doivent pas polluer l'univers de dev.
  postgres_loadtest:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spacesim
      POSTGRES_USER: spacesim
      POSTGRES_PASSWORD: spacesim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacesim -d spacesim"]
      interval: 2s
      timeout: 3s
      retries: 10
    profiles: ["tools"]

  # Harnais de charge (chantier 27.7) : démarre son propre serveur (loadtest/run.mjs),
  # attend /health, puis REST (autocannon) et WS (connexions concurrentes réelles) contre
  # ce serveur — durée de tick en régime stationnaire + percentiles de latence WS, à lire
  # par rapport à l'instrumentation de 27.5.
  loadtest:
    <<: *base
    environment:
      DATABASE_URL: postgres://spacesim:spacesim@postgres_loadtest:5432/spacesim
      # Le but ici est de mesurer un débit réel, pas de vérifier le rate-limit lui-même
      # (RATE_LIMIT_MAX=100/min par défaut, adapté à un usage normal, pas à autocannon).
      RATE_LIMIT_MAX: "1000000"
    depends_on:
      postgres_loadtest:
        condition: service_healthy
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @spacesim/server loadtest"
    profiles: ["tools"]

volumes:
  root_modules:
  shared_modules:
  protocol_modules:
  server_modules:
  web_modules:
  admin_modules:
  playwright_browsers:
  pgdata:
