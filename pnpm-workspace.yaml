packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 a cessé d'exécuter les scripts d'installation des dépendances par défaut, et pnpm 12
# ne lit plus ces réglages depuis le champ "pnpm" de package.json — ils vivent ici.
# `esbuild` est le seul à en avoir besoin : son `postinstall` pose le binaire de plateforme,
# sans quoi vite et vitest ne démarrent pas. `better-sqlite3`, que `auto-install-peers` tire
# comme pair optionnel de drizzle-orm alors que le chantier 20.3 l'a abandonné, n'y est
# justement PAS : il cesse d'être compilé de lui-même, ce qui rend inutile le
# `neverBuiltDependencies` qui le visait.
allowBuilds:
  esbuild: true

catalog:
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.2.5
  typescript: ^7.0.0
  zod: ^4.5.4
  # Rendu 3D de la carte (chantier 31.12). Catalogués ensemble : three, son binding
  # React et drei doivent monter de version de concert, un décalage casse le rendu.
  three: ^0.185.1
  "@types/three": ^0.185.4
  "@react-three/fiber": ^9.0.0
  "@react-three/drei": ^10.0.0
  # Gestes souris/pavé tactile de la carte (chantier 38). Normalise l'amplitude de la
  # molette entre périphériques et porte le `passive: false` que la carte exige : c'est la
  # seule couche du pilotage caméra qu'aucun test unitaire n'atteint.
  "@use-gesture/react": ^10.3.1
